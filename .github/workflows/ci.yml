# Непрерывная интеграция проекта integral-equations.
#
# ЗАВИСИМОСТИ-АРТЕФАКТЫ. Проект собирается против опубликованных библиотек
# `numerical-core` и `minimal-splines` (см. gradle.properties). Обе берутся из GitHub Packages
# (по одному реестру на библиотеку, объявлены в build.gradle.kts; чтение требует токена,
# поэтому в `env` ниже — встроенный GITHUB_TOKEN и разрешение `packages: read`). Задача
# `verifyArtifactDependencies` (входит в `check`) гарантирует, что библиотеки на classpath
# присутствуют только как jar, а не как исходники соседних каталогов.
#
# Разделение на job'ы повторяет разделение тестов по тегам в build.gradle.kts
# и сделано по одной причине: обратная связь на каждый PR обязана быть быстрой.
#   fast            — единицы секунд + покрытие + пороги покрытия и проверка classpath;
#                     гоняется всегда и МАТРИЦЕЙ по обоим бэкендам линейной алгебры;
#   characterization — гейт порядка сходимости (~2 мин), гоняется всегда;
#   scipy           — внешняя сверка, требует venv с Python и потому вынесена отдельно;
#   full            — прогон по крупным сеткам (`slowTest`), гоняется на каждый push и PR
#                     параллельно остальным.
#
# ЧАСТИ `check`, КОТОРЫЕ ГОНЯЮТСЯ ЗДЕСЬ ЯВНО. Целиком `./gradlew check` в CI не
# запускается: он тянет `fastTest` + `slowTest` + оба характеризационных набора, то есть
# повторил бы job `full` и подорожал бы примерно на те же 10 минут. Поэтому две проверки
# из `check`, которые НЕ являются тестами и потому не покрыты ни одним job'ом, вызываются
# в job `fast` поимённо: `verifyArtifactDependencies` (ровно один jar каждой библиотеки
# на compile classpath) и `koverVerify` (пороги покрытия). Обе бесплатны: единственный
# источник покрытия — `fastTest`, который в этом job'е и так исполняется.
#
# ХАРАКТЕРИЗАЦИОННЫЕ ГЕЙТЫ ГОНЯЮТСЯ ЗДЕСЬ — с 2026-09-16 флага отключения
# машинно-зависимых гейтов в шагах больше нет. Эталоны получили третью колонку
# `класс`, вычисленную сравнением снимков двух путей LU (`-Dnumerics.backend=java`
# против `native`): 54 ключа F1 сверяются с границей `2*cond*max(omega,eps)*||u||inf`,
# считаемой в том же прогоне, остальные 2656 — прежним строгим правилом (отн. 1e-9,
# пол 6e-13), которое перекрывает измеренное расхождение бэкендов (<= 1.0e-14) в 60 раз.
# Прогон на ubuntu/OpenBLAS — ТРЕТИЙ независимый путь LU и главное подтверждение
# классификации. Сам механизм отключения (свойство сборки, см. build.gradle.kts)
# сохранён: им помечен единственный оставшийся машинно-зависимый метод —
# `PublishedValuesTest.fredholmFirstKindMatchesPublishedValues` (сверка с ЧИСЛАМИ ИЗ
# СТАТЬИ, которые «переснять» под платформу нельзя).
# Что CI проверяет: быстрый набор, 9 тестов сверки со SciPy, 168 сочетаний порядка
# сходимости, оба характеризационных гейта (2710 значений) и 613 из 655 опубликованных
# значений (всё, кроме 42 ключей F1).
name: CI

on:
  # `push` — ТОЛЬКО `main`. При `branches: ['**']` каждая ветка с открытым PR прогоняла
  # весь workflow ДВАЖДЫ (событие `push` по ветке и событие `pull_request`): два
  # одинаковых результата за двойное время раннера. Ветки закрывает `pull_request`,
  # `main` — этот триггер. Тегов в репозитории нет (проект не публикуется); появятся —
  # сюда добавится `tags:`.
  push:
    branches: [main]
  pull_request:
  schedule:
    # Ночной полный прогон: медленный набор не должен блокировать разработку днём.
    - cron: '0 3 * * *'

# Отменяем предыдущий прогон той же ветки: устаревший результат никому не нужен,
# а медленные job'ы иначе выстраиваются в очередь.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  # Учётные данные для чтения numerical-core и minimal-splines из GitHub Packages
  # (GITHUB_ACTOR выставляет раннер). Версии артефактов задаёт gradle.properties.
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  fast:
    name: Быстрый набор тестов и покрытие (${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # МАТРИЦА БЭКЕНДОВ. `auto` МОЛЧА откатывается на чисто-Java F2J, если нативный
    # LAPACK не поднялся, — и тогда весь набор гоняется НЕ НА ТОЙ реализации LU, на которой
    # сняты эталоны. Явные леги `java` и `native` делают откат наблюдаемым: на леге
    # `native` `ActiveBackendDiagnosticTest` ТРЕБУЕТ `Backends.isNativeAvailable()` и падает
    # первым, а не сотни чисел после него. Лег `java` — доказательство того, что быстрый
    # набор не опирается на конкретную реализацию BLAS/LAPACK (машинно-зависимые гейты —
    # тег `machine` — в быстрый набор не входят).
    # macOS в матрицу НЕ добавлен осознанно: раннеры медленнее и дефицитнее, а смена
    # архитектуры проверяется локально на машине разработчика (macOS aarch64).
    strategy:
      fail-fast: false
      matrix:
        backend: [java, native]
    env:
      # Многопоточный dgetrf OpenBLAS переполняет стек потока JVM (SIGSEGV, exit 139);
      # ограничение потоков — вместе с `-Xss8m` тестовой JVM в build.gradle.kts.
      OPENBLAS_NUM_THREADS: 4
    steps:
      - uses: actions/checkout@v7

      # netlib (через numerical-core) загружает системные libblas.so.3/liblapack.so.3;
      # на голом ubuntu-runner их нет, и netlib МОЛЧА уходит в F2J — а эталоны
      # characterization/*.tsv сняты на нативном LAPACK и на F2J не воспроизводятся
      # (`ActiveBackendDiagnosticTest` это и ловит). Раньше OpenBLAS приносил multik внутри jar.
      - name: Системная BLAS/LAPACK (OpenBLAS)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libopenblas-dev liblapack-dev

      - name: Установка JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Настройка Gradle с кэшем
        uses: gradle/actions/setup-gradle@v6

      # ОДИН ЗАПУСК GRADLE НА ВЕСЬ JOB. Раньше их было два: отдельный прогон
      # `--tests solvers.core.ActiveBackendDiagnosticTest --info` ради одной строки в логе
      # и затем весь набор заново — то есть второй старт демона и тестовой JVM
      # ради диагностики, которая и так входит в `fastTest` (тег `fast`).
      #
      # Зачем диагностика вообще. `Backends.default()` в режиме `auto` при недоступности
      # нативного BLAS/LAPACK МОЛЧА откатывается на чисто-Java реализацию (F2J), а эталон
      # `baseline-eh.tsv` привязан к нативному LAPACK: на другой реализации LU гейт
      # характеризации падает на ключах F1 с расхождением до 5.7e-2 при допуске 1e-9.
      # Без явной проверки такой откат выглядел бы как «рефакторинг испортил числа»,
      # и разбирательство ушло бы не туда. `ActiveBackendDiagnosticTest` УТВЕРЖДАЕТ согласие
      # активного бэкенда со свойством `numerics.backend` и падает с внятным
      # сообщением раньше сотен чисел. (Раньше эту роль играл
      # `numerics.backend.BackendSpiTest`; после выделения numerical-core он живёт там.)
      #
      # Состав команды. `koverVerify` и `verifyArtifactDependencies` — единственные части
      # `check`, которые не являются тестами; сам `check` здесь НЕ зовётся, иначе он потянул
      # бы `slowTest` и повторил job `full` (+~10 мин на каждый лег матрицы). `koverVerify`
      # тянет тот же `fastTest` (единственный источник покрытия), то есть стоит нуль.
      # Компиляция sourceSet'ов `demo` и `problems` включена намеренно: `fastTest`
      # тянет только `problems` (он в classpath тестов), а `demo` — нет, поэтому
      # сломанный `src/demo` проходил бы зелёным на всех PR.
      - name: Быстрый набор, покрытие с порогами, classpath и компиляция demo
        run: >-
          ./gradlew fastTest koverXmlReport koverVerify verifyArtifactDependencies
          compileDemoKotlin compileProblemsKotlin
          -Dnumerics.backend=${{ matrix.backend }}

      # ДОКАЗАТЕЛЬСТВО ЗАГРУЖЕННОГО БЭКЕНДА БЕЗ ВТОРОГО ЗАПУСКА JVM.
      # Имя бэкенда печатает сам тест (`println("numerical-core: ${Backends.describe()}")`),
      # и раньше эту строку в лог выводил `--info` (на уровне INFO Gradle показывает
      # стандартные потоки тестов). На всех 142 быстрых тестах `--info` дал бы десятки
      # тысяч строк ради одной, поэтому строка берётся из <system-out> JUnit-отчёта,
      # который Gradle пишет всегда. `if: always()` — доказательство нужно ИМЕННО при
      # падении; шаг сам по себе никогда не валит job (`|| true` на grep).
      - name: Активный бэкенд линейной алгебры (из отчёта диагностики)
        if: always()
        run: |
          report='build/test-results/fastTest/TEST-solvers.core.ActiveBackendDiagnosticTest.xml'
          echo "Запрошено: numerics.backend=${{ matrix.backend }}"
          if [ -f "$report" ]; then
            grep -o 'numerical-core: .*' "$report" | head -5 || echo 'Строка диагностики не найдена в отчёте'
          else
            echo "::warning::Отчёт $report отсутствует — диагностический тест не запускался"
          fi

      - name: Отчёты тестов и покрытия
        if: always()
        uses: actions/upload-artifact@v7
        with:
          # Имя с бэкендом: иначе два лега матрицы конфликтуют за одно имя артефакта
          # (actions/upload-artifact@v4+ падает на повторной загрузке того же имени).
          name: test-reports-fast-${{ matrix.backend }}
          path: |
            build/reports/tests/fastTest/**
            build/test-results/fastTest/**
            build/reports/kover/**
          if-no-files-found: warn

  characterization:
    name: Гейты численной нейтральности и порядка сходимости
    runs-on: ubuntu-latest
    env:
      # Многопоточный dgetrf OpenBLAS переполняет стек потока JVM (SIGSEGV, exit 139);
      # ограничение потоков — вместе с `-Xss8m` тестовой JVM в build.gradle.kts.
      OPENBLAS_NUM_THREADS: 4
    # Замеры на машине разработчика: `characterizationTest` 5 тестов ~27 с,
    # `extraCharacterizationTest` ~19 с, `convergenceOrderTest` 1.5-2 мин — итого ~2.5 мин.
    # Запас многократный — на холодный старт JVM и непрогретый кэш Gradle на раннере.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # netlib (через numerical-core) загружает системные libblas.so.3/liblapack.so.3;
      # на голом ubuntu-runner их нет, и netlib МОЛЧА уходит в F2J — а эталоны
      # characterization/*.tsv сняты на нативном LAPACK и на F2J не воспроизводятся
      # (`ActiveBackendDiagnosticTest` это и ловит). Раньше OpenBLAS приносил multik внутри jar.
      - name: Системная BLAS/LAPACK (OpenBLAS)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libopenblas-dev liblapack-dev

      - name: Установка JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Настройка Gradle с кэшем
        uses: gradle/actions/setup-gradle@v6

      # ГЕЙТЫ E_h ПРОТИВ ЭТАЛОНОВ ГОНЯЮТСЯ ЗДЕСЬ. Прежде они исключались как
      # машинно-зависимые: эталон, снятый на macOS aarch64, был КРАСНЫМ на ubuntu
      # x86_64 с первого прогона (30.07). Причина названа и устранена по существу —
      # расходились 52 ключа задачи F1 (`cond_1 ~ 2.2e10`), и только они; теперь у них
      # класс `sensitive` и сверка с вычисляемой границей, а не с допуском 1e-9.
      # Прогон здесь — независимое подтверждение: OpenBLAS x86_64 — третий путь LU
      # после Accelerate и F2J. Подробности — docs/TESTING.md и docs/baseline-changes.md.

      # ГЕЙТ ПОРЯДКА СХОДИМОСТИ. Полная матрица из 168 сочетаний
      # на сетках до n = 64. Почему ЗДЕСЬ, а не в job `fast`: полная матрица стоит полторы-две
      # минуты и ломала бы требование «обратная связь на PR — единицы секунд»; быстрый
      # поднабор того же класса (тег `fast`, 32 сочетания) уже гоняется там в составе `fastTest`.
      # Почему ОТДЕЛЬНЫМ ШАГОМ, а не через `check`: задача осознанно исключена из источников
      # покрытия Kover (`disabledForTestTasks` в build.gradle.kts) — она дорожала `check` на
      # полторы-две минуты, не добавляя ни одной покрытой строки. Без этого шага гейт
      # не запускался бы НИ В ОДНОМ job, хотя docs/TESTING.md утверждает обратное.
      - name: Гейты численной нейтральности и порядка сходимости
        run: ./gradlew characterizationTest extraCharacterizationTest convergenceOrderTest

      - name: Отчёты гейтов
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-characterization
          # Отчёты всех трёх гейтов этого job'а: оба характеризационных и порядок сходимости.
          path: |
            build/reports/tests/characterizationTest/**
            build/test-results/characterizationTest/**
            build/reports/tests/extraCharacterizationTest/**
            build/test-results/extraCharacterizationTest/**
            build/reports/tests/convergenceOrderTest/**
            build/test-results/convergenceOrderTest/**
          if-no-files-found: warn

  scipy:
    name: Внешняя сверка со SciPy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Многопоточный dgetrf OpenBLAS переполняет стек потока JVM (SIGSEGV, exit 139);
      # ограничение потоков — вместе с `-Xss8m` тестовой JVM в build.gradle.kts.
      OPENBLAS_NUM_THREADS: 4
    steps:
      - uses: actions/checkout@v7

      # netlib (через numerical-core) загружает системные libblas.so.3/liblapack.so.3;
      # на голом ubuntu-runner их нет, и netlib МОЛЧА уходит в F2J — а эталоны
      # characterization/*.tsv сняты на нативном LAPACK и на F2J не воспроизводятся
      # (`ActiveBackendDiagnosticTest` это и ловит). Раньше OpenBLAS приносил multik внутри jar.
      - name: Системная BLAS/LAPACK (OpenBLAS)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libopenblas-dev liblapack-dev

      - name: Установка JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Настройка Gradle с кэшем
        uses: gradle/actions/setup-gradle@v6

      # Ключ кэша — хеш файла требований: смена пиннинга обязана приводить к
      # переустановке окружения, иначе сверка шла бы на старых версиях SciPy.
      - name: Кэш окружения Python со SciPy
        uses: actions/cache@v6
        with:
          path: .venv-verify
          key: venv-verify-${{ runner.os }}-${{ hashFiles('tools/requirements-verify.txt') }}

      # Задача выставляет `scipy.required=true`, поэтому битое окружение
      # (интерпретатор есть, SciPy нет) даёт FAILURE, а не 9 тихих SKIP при
      # зелёной сборке. Именно этого job'а не должно быть достаточно «пройти молча».
      # Фактический замер: 9 тестов, 60 проверок, NumPy 2.5.1 / SciPy 1.18.0.
      - name: Внешняя сверка со SciPy/NumPy
        run: ./gradlew scipyVerify

      - name: Отчёты сверки
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-scipy
          path: |
            build/reports/tests/scipyVerify/**
            build/test-results/scipyVerify/**
            build/verification/scipy-report.json
          if-no-files-found: warn

  # -------------------------------------------------------------------------
  # JOB `full` — МЕДЛЕННЫЙ НАБОР ЦЕЛИКОМ (включён этапом 8.6).
  #
  # ИСТОРИЯ. До этапа 8.6 job был ЗАКОММЕНТИРОВАН, и причина была не во времени
  # прогона, а в КРАСНОМ РЕЗУЛЬТАТЕ: `PublishedValuesTest.fredholmFirstKindMatchesPublishedValues`
  # давал 4 расхождения с публикацией на ключах `F.F1.H.theta.*` (до 6.78 % при
  # допуске 2 %) — уравнение ПЕРВОГО рода F1 с регуляризацией Вазваза,
  # `cond(I - M) ~ 1e10`. Пункт 8.6 закрыл это НЕ ослаблением общего допуска (он
  # по-прежнему 2 %), а узким классом 8 % для шести ключей таблицы `table-f1.tex`,
  # выведенным из измеренного разброса между реализациями LU на этих же ключах;
  # компенсация — покрытие F1 в `baseline-eh.tsv` расширено с 4 до 54 ключей.
  #
  # ЗАМЕР ПОСЛЕ ЗАКРЫТИЯ (`./gradlew slowTest --rerun`, машина разработчика):
  # 23 теста, 0 падений, 8 мин 39 с (из них `PublishedValuesTest` ~190 с,
  # `ConvergenceOrderTest` 1.5-2 мин). `timeout-minutes: 45` — запас пятикратный на
  # более медленный раннер, холодный старт JVM и непрогретый кэш Gradle.
  #
  # ПОЧЕМУ ОТДЕЛЬНЫМ JOB'ОМ, а не шагом в `fast`. Восемь минут в job'е `fast`
  # сломали бы его назначение — обратная связь на PR за единицы секунд.
  # Отдельный job идёт ПАРАЛЛЕЛЬНО остальным и ничего не замедляет.
  #
  # ПОЧЕМУ БЕЗ УСЛОВИЯ `if:` НА ВЕТКУ (было `github.ref == 'refs/heads/main'`).
  # Смысл гейта — поймать регрессию ДО мержа, а не после. Гейт, работающий
  # только на `main`, сообщает о поломке тогда, когда она уже в основной ветке.
  # Сверка с публикацией и ограничитель ширины послабления живут именно здесь.
  #
  # Вариант `continue-on-error: true` ОТВЕРГНУТ и сейчас: он даёт ЗЕЛЁНУЮ галочку
  # при невыполненных проверках — ровно тот ложный сигнал, от которого этап
  # избавлялся в остальных местах.
  #
  # СООТНОШЕНИЕ С `check`: `slowTest` также входит в `check` (через источники Kover,
  # см. build.gradle.kts), то есть исполняется и локально в `./gradlew build`.
  # Этот job — гарантия на стороне CI, не зависящая от поведения плагина Kover.
  full:
    name: Медленный набор тестов (сверка с публикацией)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Многопоточный dgetrf OpenBLAS переполняет стек потока JVM (SIGSEGV, exit 139);
      # ограничение потоков — вместе с `-Xss8m` тестовой JVM в build.gradle.kts.
      OPENBLAS_NUM_THREADS: 4
    steps:
      - uses: actions/checkout@v7

      # netlib (через numerical-core) загружает системные libblas.so.3/liblapack.so.3;
      # на голом ubuntu-runner их нет, и netlib МОЛЧА уходит в F2J — а эталоны
      # characterization/*.tsv сняты на нативном LAPACK и на F2J не воспроизводятся
      # (`ActiveBackendDiagnosticTest` это и ловит). Раньше OpenBLAS приносил multik внутри jar.
      - name: Системная BLAS/LAPACK (OpenBLAS)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libopenblas-dev liblapack-dev

      - name: Установка JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Настройка Gradle с кэшем
        uses: gradle/actions/setup-gradle@v6

      # 23 теста тега `slow` за ОДИН запуск. Главное здесь и ни в одном другом job'е:
      # `PublishedValuesTest` — сверка с ВНЕШНИМ источником правды, не замкнутая
      # на собственные снимки проекта.
      # ЕДИНСТВЕННОЕ МЕСТО, где флаг ещё нужен: набор `slow` содержит
      # `PublishedValuesTest.fredholmFirstKindMatchesPublishedValues` с тегом `machine`
      # (сверка 42 ключей F1 с числами ИЗ СТАТЬИ; переснять их под платформу нельзя).
      # Флаг исключает ровно этот метод — остальные 613 опубликованных значений
      # сверяются здесь как обычно. Характеризационные гейты им больше не управляются.
      - name: Медленный набор тестов
        run: ./gradlew slowTest -PmachineDependentGates=false

      # ДИАГНОСТИКА ПАДЕНИЙ ЧЕРЕЗ АННОТАЦИИ — НЕ КОСМЕТИКА, А ЕДИНСТВЕННЫЙ КАНАЛ.
      #
      # Проблема, ради которой этот шаг существует: логи job'а и артефакты через
      # REST API требуют админ-прав на репозиторий (403 Must have admin rights),
      # а штатные аннотации при падении содержат лишь «Process completed with exit
      # code 1». То есть без этого шага причина падения видна ТОЛЬКО владельцу
      # репозитория вручную через UI, а любому другому участнику и любому
      # автоматическому средству — не видна вообще.
      #
      # Команда рабочего процесса `::error::` создаёт аннотацию, которая видна
      # и в UI, и через API БЕЗ привилегий. Здесь она наполняется из JUnit-отчётов,
      # то есть в аннотацию попадают ИМЕНА тестов и САМИ РАСХОЖДЕНИЯ (ключ,
      # опубликованное и вычисленное значение, процент расхождения).
      #
      # Сторонние action’ы (dorny/test-reporter и пр.) сознательно НЕ использованы:
      # задача решается встроенным механизмом, и гейт не должен зависеть от чужого
      # репозитория и его прав на токен.
      #
      # `if: ${{ !cancelled() }}` — шаг обязан отработать ИМЕННО при падении
      # предыдущего; при отмене прогона — нет (поэтому не `always()`).
      # Сам шаг ВСЕГДА завершается успехом: он только СООБЩАЕТ о падениях,
      # а вердикт job'а остаётся за шагом с тестами.
      - name: Детали падений в аннотации (видны без админ-прав)
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET

          def annotate(text: str) -> str:
              # Экранирование по спецификации workflow-команд: без него многострочное
              # сообщение оборвётся на первой же строке.
              return (text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))

          found = 0
          for path in sorted(glob.glob('build/test-results/**/*.xml', recursive=True)):
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError:
                  continue
              for case in root.iter('testcase'):
                  for bad in list(case.iter('failure')) + list(case.iter('error')):
                      found += 1
                      body = bad.get('message') or bad.text or ''
                      # Лимит аннотации — порядка 64 КБ; берём с запасом.
                      print(f"::error title={case.get('classname')}.{case.get('name')}::"
                            f"{annotate(body[:8000])}")
          print(f"Найдено падений в отчётах: {found}")
          PY

      - name: Отчёты тестов
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-full
          path: |
            build/reports/tests/slowTest/**
            build/test-results/slowTest/**
          if-no-files-found: warn
