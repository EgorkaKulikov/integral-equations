# Version catalog (Gradle version catalog).
#
# This file collects the versions of TOOLS and external libraries so that they need
# not be hunted down in the text of build.gradle.kts. The numerical-core and
# minimal-splines versions are deliberately NOT declared here: they are updated by the
# dependency-update procedure and live in gradle.properties (`numericalCoreVersion`,
# `minimalSplinesVersion`). Only their COORDINATES (group and artifact) are declared
# here, while the version is substituted in build.gradle.kts from a project property.

[versions]
kotlin = "2.0.0"
kover = "0.8.3"
junit = "5.11.4"

[libraries]
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

# The version is set in build.gradle.kts from gradle.properties (see the file header).
numerical-core = { module = "io.github.egorkakulikov:numerical-core" }
minimal-splines = { module = "io.github.egorkakulikov:minimal-splines" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
